<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gift Reveal V3 Balanced</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Meiryo,sans-serif}
#main{height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
#title{font-size:1.5rem;margin-bottom:20px}
/* 数字部分の幅を調整し、マージンで左へ1文字分ほどずらして 
   視覚的に中央に来るようにいたしました。
*/
#amount{font-size:5rem;font-weight:bold;min-height:120px;width:300px;text-align:right;margin:0 40px 0 0}
#caption{font-size:2rem;color:gold;min-height:60px}
#comment{font-size:1.3rem}
#push{width:180px;height:180px;border-radius:50%;font-size:2rem;font-weight:bold;border:8px solid #ff0;background:radial-gradient(circle,#fff176,#f57f17);box-shadow:0 0 20px gold,0 0 50px orange;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.glow{animation:glow .7s infinite alternate}
@keyframes glow{from{text-shadow:0 0 10px gold}to{text-shadow:0 0 50px gold,0 0 90px gold}}
#cutin{position:fixed;left:-120%;top:0;width:120%;height:100%;background:linear-gradient(90deg,#b00,#ff0);transform:skewX(-20deg);display:flex;justify-content:center;align-items:center;z-index:10}
#cutinText{transform:skewX(20deg);font-size:12rem;font-weight:bold}
.show{animation:cutin 1s forwards}
@keyframes cutin{0%{left:-120%}25%,75%{left:-10%}100%{left:120%}}
canvas{position:fixed;top:0;left:0;pointer-events:none}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div id="cutin"><div id="cutinText">激熱</div></div>
<div id="main">
<div id="title"></div>
<div id="amount"></div>
<div id="caption"></div>
<div id="comment"></div>
<button id="push">PUSH</button>
</div>
<script>
let step=0;
const amount=document.getElementById("amount");
const caption=document.getElementById("caption");
const cutin=document.getElementById("cutin");
document.getElementById("push").onclick=next;

function beep(f,d){
 const c=new(window.AudioContext||window.webkitAudioContext)();
 const o=c.createOscillator(),g=c.createGain();
 o.connect(g);g.connect(c.destination);
 o.frequency.value=f;o.start();
 g.gain.setValueAtTime(.05,c.currentTime);
 g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d);
 o.stop(c.currentTime+d);
}

function next(){
 if(step===0){
   title.innerText="Amazonギフトカード査定額";
   // 初期の「0」表示を廃止し、空欄からスタートいたします
   amount.innerText="";
   step++;return;
 }

 const vals=[["0","イチ！"],["00","ジュウ！"],["000","ヒャク！"]];
 if(step<=3){
   amount.innerText=vals[step-1][0];
   caption.innerText=vals[step-1][1];
   beep(400+step*150,.12);
 }

 if(step===4){
   reelReveal();
 }
 step++;
}

function reelReveal(){
 caption.innerText="ドゥルルルルル…";
 let n=0;
 const t=setInterval(()=>{
   amount.innerText=(Math.floor(Math.random()*9)+1)+",000";
   beep(900,.03);
   n++;
   if(n>50){
      clearInterval(t);
      cutin.classList.add("show");
      setTimeout(()=>{
         amount.innerText="5,000";
         amount.classList.add("glow");
         caption.innerText="ジャーーーン！！";

         confetti();
         beep(1400,.5);
         document.getElementById("push").style.display="none";
      }, 500);
   }
 },45);
}

function confetti(){
 const c=document.getElementById("confetti"),x=c.getContext("2d");
 c.width=innerWidth;c.height=innerHeight;
 const p=[...Array(180)].map(()=>({x:Math.random()*c.width,y:-20,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,s:4+Math.random()*8,col:`hsl(${Math.random()*360} 100% 50%)`}));
 (function d(){
   x.clearRect(0,0,c.width,c.height);
   p.forEach(a=>{a.x+=a.vx;a.y+=a.vy;x.fillStyle=a.col;x.fillRect(a.x,a.y,a.s,a.s)});
   requestAnimationFrame(d);
 })();
}
</script>
</body>
</html>

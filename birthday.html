<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ぷちっがい おたんじょうび動画</title>
  <style>
    body {
      margin: 0;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
    }

    .scene {
      position: relative;
      width: 1280px;
      height: 720px;
      overflow: hidden;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
    }

    .bg {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .banner {
      position: absolute;
      top: -140px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #b8860b 0%, #ffd700 25%, #fff4b0 50%, #ffd700 75%, #b8860b 100%);
      color: #7a1f1f;
      padding: 24px 80px;
      font-size: 48px;
      font-weight: 900;
      border-radius: 24px;
      border: 8px double #fff8dc;
      box-shadow:
        0 10px 20px rgba(0,0,0,0.25),
        inset 0 2px 10px rgba(255,255,255,0.8),
        inset 0 -4px 10px rgba(0,0,0,0.15);
      text-shadow:
        2px 2px 0 rgba(255,255,255,0.5),
        -1px -1px 0 rgba(0,0,0,0.15);
      animation: dropBanner 2s forwards ease-out;
      z-index: 20;
    }

    @keyframes dropBanner {
      0% { top: -140px; }
      70% { top: 30px; }
      85% { top: 10px; }
      100% { top: 20px; }
    }

    .arm {
      position: absolute;
      width: 18px;
      height: 70px;
      background: transparent;
      transform-origin: top center;
      z-index: 15;
    }

    .left-arm {
      left: 595px;
      top: 350px;
      animation: waveLeft 0.8s infinite ease-in-out;
    }

    .right-arm {
      left: 690px;
      top: 350px;
      animation: waveRight 0.8s infinite ease-in-out;
    }

    @keyframes waveLeft {
      0% { transform: rotate(-20deg); }
      50% { transform: rotate(20deg); }
      100% { transform: rotate(-20deg); }
    }

    @keyframes waveRight {
      0% { transform: rotate(20deg); }
      50% { transform: rotate(-20deg); }
      100% { transform: rotate(20deg); }
    }

    .cracker {
      position: absolute;
      top: 180px;
      width: 0;
      height: 0;
      border-radius: 50%;
      opacity: 0;
      z-index: 18;
    }

    .cracker.left {
      left: 120px;
      animation: burstLeft 1s 1.6s forwards;
    }

    .cracker.right {
      right: 120px;
      animation: burstRight 1s 1.6s forwards;
    }

    @keyframes burstLeft {
      0% {
        opacity: 0;
        box-shadow: none;
      }
      20% {
        opacity: 1;
        box-shadow:
          0 0 0 10px #ff0,
          40px -20px 0 8px #f0f,
          -30px 20px 0 8px #0ff,
          20px 40px 0 8px #0f0,
          -40px -30px 0 8px #f66;
      }
      100% {
        opacity: 0;
      }
    }

    @keyframes burstRight {
      0% {
        opacity: 0;
        box-shadow: none;
      }
      20% {
        opacity: 1;
        box-shadow:
          0 0 0 10px #ff0,
          40px -20px 0 8px #f0f,
          -30px 20px 0 8px #0ff,
          20px 40px 0 8px #0f0,
          -40px -30px 0 8px #f66;
      }
      100% {
        opacity: 0;
      }
    }

    .confetti {
      position: absolute;
      width: 12px;
      height: 18px;
      top: -30px;
      opacity: 0.9;
      animation: fall linear infinite;
    }

    @keyframes fall {
      from {
        transform: translateY(-50px) rotate(0deg);
      }
      to {
        transform: translateY(900px) rotate(720deg);
      }
    }

    .message {
      position: absolute;
      bottom: 30px;
      width: 100%;
      text-align: center;
      font-size: 42px;
      color: white;
      text-shadow: 0 0 8px rgba(0,0,0,0.8);
      font-weight: bold;
      letter-spacing: 4px;
      z-index: 25;
      animation: fadeIn 2s;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (max-width: 768px) {
      .scene {
        width: 100vw;
        height: 56.25vw;
        border-radius: 0;
      }

      .banner {
        font-size: 28px;
        padding: 18px 28px;
        width: 82%;
        text-align: center;
        border-width: 5px;
      }

      .message {
        font-size: 24px;
        bottom: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="scene">
    <img class="bg" src="postImages_1778427443006_ca347447-d4db-4b07-8582-c00aed8696c0.jpg" />

    <div class="banner">おたんじょうび<br>おめでとう</div>

    <div class="arm left-arm"></div>
    <div class="arm right-arm"></div>

    <div class="cracker left"></div>
    <div class="cracker right"></div>

    <div class="message">Luvからのプレゼント</div>
  </div>

  <script>
    const scene = document.querySelector('.scene');
    const colors = ['#ff4d4d','#4dd2ff','#ffd24d','#66ff66','#ff66cc','#ffffff'];

    for(let i = 0; i < 120; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 1280 + 'px';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      c.style.animationDuration = (4 + Math.random()*4) + 's';
      c.style.animationDelay = (Math.random()*3) + 's';
      c.style.opacity = Math.random();
      scene.appendChild(c);
    }
  </script>
</body>
</html>
